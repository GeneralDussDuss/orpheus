# Boots the daemon on Windows. It only answers once mpv is up on its named
# pipe, so a 200 from /status proves the Windows IPC path end to end.
name: windows

on:
  push:
    paths: ["orpheusd/**", "*.qml", "*.js", "shaders/**", "install.ps1", "pyproject.toml", "uv.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  daemon:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: mpv
        run: choco install mpv --no-progress -y
      - name: where mpv landed
        shell: pwsh
        run: |
          Get-Command mpv -ErrorAction SilentlyContinue | Format-List Source
          Get-ChildItem C:\ProgramData\chocolatey -Recurse -Filter mpv*.exe -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
      - name: python environment
        run: uv sync --frozen
      - name: daemon answers, signed out, with mpv on a named pipe
        shell: pwsh
        run: |
          $d = Start-Process -PassThru -NoNewWindow .venv\Scripts\orpheusd.exe `
                 -ArgumentList '--port', '47999', '-v' `
                 -RedirectStandardOutput out.log -RedirectStandardError err.log
          $s = $null
          foreach ($i in 1..60) {
            try { $s = Invoke-RestMethod http://127.0.0.1:47999/status -TimeoutSec 2; break } catch { Start-Sleep 1 }
          }
          Stop-Process $d -ErrorAction SilentlyContinue
          .venv\Scripts\python.exe -c "from orpheusd.system import mpv_path; print('mpv_path:', mpv_path())"
          Get-Content err.log -Tail 40
          if (-not $s) { throw "orpheusd never answered" }
          $s | ConvertTo-Json -Depth 4 | Select-Object -First 30
          if ($s.login.state -ne 'signed-out') { throw "expected signed-out, got $($s.login.state)" }
          if ($s.player.error) { throw "player error: $($s.player.error)" }
          if ($s.providers.anime) { throw "anime should be off on Windows" }

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: python environment with the desktop extra
        run: uv sync --frozen --extra desktop
      - name: the player and the stage render off-screen
        shell: pwsh
        env:
          QT_QPA_FONTDIR: C:\Windows\Fonts   # the offscreen platform finds no fonts otherwise
        run: |
          .venv\Scripts\python.exe -m orpheusd.desktop --shot shots --no-daemon 2>&1 | Tee-Object -Variable lib
          .venv\Scripts\python.exe -m orpheusd.desktop --shot shots --no-daemon --open toggle --style orb 2>&1 | Tee-Object -Variable stage
          if (-not (Test-Path shots\*Orpheus*.png)) { throw "the player window did not render" }
          if (-not (Test-Path shots\*Stage*.png)) { throw "the stage did not render" }
          if ("$lib $stage" -match "qml:") { throw "QML warnings on Windows" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 under Windows PowerShell 5.1, from this checkout
        shell: powershell
        env:
          ORPHEUS_REPO: ${{ github.workspace }}
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Host "::warning::no winget on this runner"; exit 0 }
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          $app = "$env:LOCALAPPDATA\Orpheus\app"
          if (-not (Test-Path "$app\.venv\Scripts\pythonw.exe")) { throw "no environment" }
          if (-not (Test-Path ([Environment]::GetFolderPath('Programs') + '\Orpheus.lnk'))) { throw "no Start menu entry" }
          $s = $null
          foreach ($i in 1..60) { try { $s = Invoke-RestMethod http://127.0.0.1:47837/status -TimeoutSec 2; break } catch { Start-Sleep 1 } }
          if (-not $s) {
            Get-ChildItem "$env:LOCALAPPDATA\Orpheus\state\*.log" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_ -Tail 30 }
            Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Filter mpv.exe -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
            throw "the app did not bring the daemon up"
          }
          Write-Host "daemon up, version $($s.version), $($s.login.state)"
          $apps = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orpheus'
          if (-not (Test-Path "$env:LOCALAPPDATA\Orpheus\orpheus.ico")) { throw "no icon" }
          if (-not (Test-Path $apps)) { throw "no Settings > Apps entry" }
          Write-Host "apps entry: $((Get-ItemProperty $apps).DisplayName) $((Get-ItemProperty $apps).DisplayVersion)"
          # A second launch hands over to the running app and exits.
          $t = Measure-Command { Start-Process -Wait -FilePath "$app\.venv\Scripts\python.exe" -ArgumentList '-m','orpheusd.desktop','--open','library' }
          if ($t.TotalSeconds -gt 15) { throw "second launch did not hand over ($($t.TotalSeconds) s)" }
          Write-Host "second launch handed over in $([math]::Round($t.TotalSeconds,1)) s"
          Get-Content "$env:LOCALAPPDATA\Orpheus\state\desktop.log" -ErrorAction SilentlyContinue | Select-Object -First 10
          & "$app\install.ps1" -Uninstall
          if (Test-Path $app) { throw "uninstall left the app folder" }
          if (Test-Path $apps) { throw "uninstall left the Settings > Apps entry" }
