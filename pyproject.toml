[project]
name = "orpheus"
version = "0.1.0"
description = "Orpheus: an Omarchy-native TIDAL player daemon (search, library, hi-res playback via mpv, MPRIS)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "tidalapi>=0.8.11",
  "aiohttp>=3.10",
  "dbus-next>=0.2.3",
]

[project.scripts]
orpheusd = "orpheusd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orpheusd"]
